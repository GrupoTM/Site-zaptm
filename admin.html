<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZAP TM · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{color-scheme:dark;
    --navy:#0A1A2F; --navy-2:#0E2038; --navy-3:#122A48;
    --green:#19C37D; --green-strong:#12A867; --green-soft:#0E3B2C;
    --white:#FFFFFF; --ink:#0B1B2E; --ink-2:#33475B;
    --slate:#93A6BC; --slate-2:#6E829A; --line:rgba(255,255,255,.09);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--navy); color:#EAF1F8; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh}
  h1,h2,h3{margin:0; letter-spacing:-.02em; font-weight:800; line-height:1.15}
  p{margin:0}
  .logo{display:inline-flex; align-items:center; gap:10px; font-weight:800}
  .logo-mark{width:36px; height:36px; border-radius:10px; background:var(--green); display:grid; place-items:center; color:#052316; font-weight:900; font-size:14px}
  .logo-txt{font-size:18px} .logo-txt span{color:var(--green)}
  .logo-img{height:34px; width:auto; display:block}
  .adm-tag{font-size:11px; font-weight:800; color:var(--green); background:var(--green-soft); padding:3px 9px; border-radius:999px; margin-left:6px; letter-spacing:.04em}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; font-weight:700; font-size:14.5px; border-radius:999px; cursor:pointer; border:1px solid transparent; transition:background .2s,border-color .2s,transform .1s}
  .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.6; cursor:default}
  .btn-green{background:var(--green); color:#052316; padding:12px 20px} .btn-green:hover{background:var(--green-strong)}
  .btn-ghost{background:transparent; color:#fff; border-color:var(--line); padding:10px 18px} .btn-ghost:hover{border-color:rgba(255,255,255,.3)}
  .btn-sm{padding:8px 14px; font-size:13.5px}
  .btn-danger{background:#3A1A1F; color:#F0B4B0; border:1px solid #7A3038} .btn-danger:hover{background:#4a2129}
  .link{color:var(--green); font-weight:600; cursor:pointer; font-size:14px; background:none; border:none; font-family:inherit; padding:0} .link:hover{text-decoration:underline}
  .hidden{display:none !important}
  input,select{width:100%; background:var(--navy); border:1px solid var(--line); border-radius:10px; padding:11px 13px; color:#fff; font-family:inherit; font-size:14.5px; outline:none}
  input:focus,select:focus{border-color:var(--green)}
  input:disabled{opacity:.6; cursor:not-allowed}
  input::placeholder{color:var(--slate-2)}
  label{display:block; font-size:12.5px; color:var(--slate); font-weight:600; margin-bottom:6px}
  .msg{font-size:13.5px; border-radius:10px; padding:11px 13px; margin-bottom:14px; line-height:1.5; display:none}
  .msg.err{background:#3A1A1F; border:1px solid #7A3038; color:#F0B4B0; display:block}
  .msg.ok{background:var(--green-soft); border:1px solid rgba(25,195,125,.4); color:#8DE9C0; display:block}

  .auth{min-height:100vh; display:grid; place-items:center; padding:28px 20px}
  .card{background:var(--navy-2); border:1px solid var(--line); border-radius:20px; padding:26px}
  .auth .card{width:100%; max-width:380px}
  .auth-head{text-align:center; margin-bottom:22px}
  .auth-head .logo{justify-content:center; margin-bottom:16px}
  .field{margin-bottom:14px}

  .topbar{position:sticky; top:0; z-index:20; padding-top:env(safe-area-inset-top,0px); background:rgba(10,26,47,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
  .topbar-in{max-width:960px; margin:0 auto; padding:0 20px; height:62px; display:flex; align-items:center; justify-content:space-between; gap:12px}
  .topbar .right{display:flex; align-items:center; gap:8px}
  .topbar .who{font-size:13px; color:var(--slate); margin-right:4px}
  .main{max-width:960px; margin:0 auto; padding:24px 20px 60px}
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap}
  .head-row h2{font-size:20px}

  .cli{background:var(--navy-2); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:14px}
  .cli-top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .cli-name{font-size:16px; font-weight:800}
  .cli-meta{font-size:13px; color:var(--slate); margin-top:3px}
  .pill{font-size:11.5px; font-weight:800; padding:4px 11px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em}
  .pill.ativo{background:var(--green-soft); color:var(--green)}
  .pill.inativo{background:#3A1A1F; color:#E9968F}
  .plano{font-size:11.5px; font-weight:700; color:var(--slate); background:var(--navy); border:1px solid var(--line); padding:4px 10px; border-radius:999px; text-transform:capitalize}
  .nums{margin-top:14px; display:flex; flex-direction:column; gap:8px}
  .num{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--navy); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13.5px}
  .num .nlabel{font-weight:600} .num .nsub{color:var(--slate); font-size:12.5px}
  .num a{color:var(--green); font-weight:600; font-size:12.5px}
  .cli-actions{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap}

  .form-card{background:var(--navy-2); border:1px solid var(--green); border-radius:18px; padding:24px; margin-bottom:22px}
  .form-card h3{font-size:16px; margin-bottom:16px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .num-row{display:grid; grid-template-columns:1fr 1fr 1fr 1.3fr auto; gap:10px; align-items:end; margin-bottom:10px}
  .num-row .rm{background:#3A1A1F; color:#F0B4B0; border:1px solid #7A3038; border-radius:9px; width:40px; height:42px; cursor:pointer; font-size:18px}
  .state{padding:36px 20px; text-align:center; color:var(--slate)}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr} .num-row{grid-template-columns:1fr 1fr} .num-row .rm{width:100%} }
</style>
</head>

  <div class="main">
    <div class="head-row">
      <h2>Clientes</h2>
      <button class="btn btn-green btn-sm" id="novoBtn" onclick="abrirNovo()">+ Novo cliente</button>
    </div>

    <div class="form-card hidden" id="formCard">
      <h3 id="formTitle">Novo cliente</h3>
      <div class="msg" id="formMsg"></div>
      <div class="grid2">
        <div class="field"><label>Nome do responsável *</label><input id="f_nome" placeholder="Ex.: Maria Silva"></div>
        <div class="field"><label>Empresa</label><input id="f_empresa" placeholder="Ex.: Ótica Central"></div>
        <div class="field"><label>Email de acesso *</label><input id="f_email" type="email" placeholder="cliente@empresa.com"></div>
        <div class="field"><label>WhatsApp (recuperação)</label><input id="f_whatsapp" placeholder="5581900000000"></div>
        <div class="field"><label>Plano</label>
          <select id="f_plano" onchange="planoHint()">
            <option value="essencial">Essencial</option>
            <option value="profissional">Profissional</option>
            <option value="performance">Performance</option>
          </select>
        </div>
        <div class="field" id="senhaField"><label>Senha provisória *</label><input id="f_senha" placeholder="ex.: ZapTM2026"></div>
      </div>

      <div style="margin:6px 0 10px"><label>Números do cliente <span id="planoHint" style="color:var(--slate-2)"></span></label></div>
      <div id="numsForm"></div>
      <button class="link" id="addNum" onclick="addNumRow()">+ adicionar número</button>

      <div style="margin-top:18px; display:flex; gap:10px">
        <button class="btn btn-green" id="salvarBtn" onclick="salvar()">Cadastrar cliente</button>
        <button class="btn btn-ghost" onclick="fecharForm()">Cancelar</button>
      </div>
    </div>

    <div id="lista"></div>
    <div class="state hidden" id="stateBox"></div>
  </div>

<script>
  const SUPABASE_URL = 'https://oebwqhimbixboyjjrsiv.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lYndxaGltYml4Ym95ampyc2l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzM0NjUsImV4cCI6MjA5OTk0OTQ2NX0.ZYYWHdmV0F7Wdna_1-Y8V7VDAtV3jClkq-eRfyJSZtg';
  const FN_URL = SUPABASE_URL + '/functions/v1/zaptm-criar-cliente';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let CLIENTES = [], NUMEROS = [], editId = null, numsRemovidos = [];

  function showAuth(){ document.getElementById('app').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); }
  function showApp(){ document.getElementById('authScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); }

  async function login(){
    const email=document.getElementById('email').value.trim();
    const pass=document.getElementById('pass').value;
    const msg=document.getElementById('loginMsg'); const btn=document.getElementById('loginBtn');
    msg.className='msg';
    if(!email||!pass){ msg.className='msg err'; msg.textContent='Preencha email e senha.'; return; }
    btn.disabled=true; btn.textContent='Entrando...';
    const { error }=await sb.auth.signInWithPassword({email, password:pass});
    btn.disabled=false; btn.textContent='Entrar';
    if(error){ msg.className='msg err'; msg.textContent='Email ou senha inválidos.'; return; }
    const { data:isAdmin }=await sb.rpc('zaptm_is_admin');
    if(!isAdmin){ msg.className='msg err'; msg.textContent='Esta conta não é administradora.'; await sb.auth.signOut(); return; }
    enterApp();
  }
  async function enterApp(){
    const { data:{ user } }=await sb.auth.getUser();
    document.getElementById('who').textContent=user? user.email : '';
    showApp(); carregar();
  }
  async function sair(){ await sb.auth.signOut(); showAuth(); }
  async function trocarSenha(){
    const nova=prompt('Digite a nova senha (mínimo 6 caracteres):');
    if(!nova) return;
    if(nova.length<6){ alert('Senha muito curta.'); return; }
    const { error }=await sb.auth.updateUser({ password:nova });
    alert(error? ('Erro: '+error.message) : 'Senha alterada com sucesso.');
  }

  function setState(t){ const s=document.getElementById('stateBox'); s.textContent=t; s.classList.remove('hidden'); document.getElementById('lista').innerHTML=''; }
  function clearState(){ document.getElementById('stateBox').classList.add('hidden'); }

  async function carregar(){
    setState('Carregando clientes...');
    const { data:cli, error }=await sb.from('zaptm_clientes').select('*').order('created_at',{ascending:false});
    if(error){ setState('Erro ao carregar: '+error.message); return; }
    const { data:nums }=await sb.from('zaptm_numeros').select('*').order('created_at');
    CLIENTES=cli||[]; NUMEROS=nums||[];
    clearState();
    render();
  }

  function render(){
    const box=document.getElementById('lista');
    if(!CLIENTES.length){ box.innerHTML='<div class="state">Nenhum cliente cadastrado ainda. Clique em "+ Novo cliente".</div>'; return; }
    box.innerHTML=CLIENTES.map(function(c){
      const meus=NUMEROS.filter(function(n){ return n.cliente_id===c.id; });
      const numsHtml=meus.length? meus.map(function(n){
        return '<div class="num"><div><div class="nlabel">'+esc(n.nome)+'</div><div class="nsub">'+esc(n.numero||'sem número')+'</div></div>'
          +(n.painel_comercial_url? '<a href="'+esc(n.painel_comercial_url)+'" target="_blank" rel="noopener">painel comercial</a>':'')+'</div>';
      }).join('') : '<div class="nsub" style="color:var(--slate-2); font-size:13px">Sem números cadastrados.</div>';
      const ativo=c.status==='ativo';
      return '<div class="cli">'
        +'<div class="cli-top"><div><div class="cli-name">'+esc(c.empresa||c.nome)+'</div>'
        +'<div class="cli-meta">'+esc(c.nome)+' · '+esc(c.email)+(c.whatsapp?' · '+esc(c.whatsapp):'')+'</div></div>'
        +'<div style="display:flex; gap:8px; align-items:center"><span class="plano">'+esc(c.plano)+'</span>'
        +'<span class="pill '+(ativo?'ativo':'inativo')+'">'+(ativo?'Ativo':'Inativo')+'</span></div></div>'
        +'<div class="nums">'+numsHtml+'</div>'
        +'<div class="cli-actions">'
        +'<button class="btn btn-ghost btn-sm" onclick="abrirEditar(\''+c.id+'\')">Editar</button>'
        +'<button class="btn '+(ativo?'btn-danger':'btn-green')+' btn-sm" onclick="toggleStatus(\''+c.id+'\',\''+(ativo?'inativo':'ativo')+'\')">'+(ativo?'Desativar':'Ativar')+'</button>'
        +'</div></div>';
    }).join('');
  }

  async function toggleStatus(id, novo){
    const { error }=await sb.from('zaptm_clientes').update({ status:novo }).eq('id', id);
    if(error){ alert('Erro: '+error.message); return; }
    carregar();
  }

  // ---- formulário (novo + editar) ----
  function abrirNovo(){
    editId=null; numsRemovidos=[];
    document.getElementById('formTitle').textContent='Novo cliente';
    document.getElementById('salvarBtn').textContent='Cadastrar cliente';
    document.getElementById('senhaField').classList.remove('hidden');
    document.getElementById('f_email').disabled=false;
    ['f_nome','f_empresa','f_email','f_whatsapp','f_senha'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('f_plano').value='essencial';
    document.getElementById('numsForm').innerHTML=''; addNumRow();
    document.getElementById('formMsg').className='msg';
    planoHint(); openForm();
  }
  function abrirEditar(id){
    const c=CLIENTES.find(function(x){ return x.id===id; }); if(!c) return;
    editId=id; numsRemovidos=[];
    document.getElementById('formTitle').textContent='Editar cliente';
    document.getElementById('salvarBtn').textContent='Salvar alterações';
    document.getElementById('senhaField').classList.add('hidden');
    document.getElementById('f_nome').value=c.nome||'';
    document.getElementById('f_empresa').value=c.empresa||'';
    document.getElementById('f_email').value=c.email||''; document.getElementById('f_email').disabled=true;
    document.getElementById('f_whatsapp').value=c.whatsapp||'';
    document.getElementById('f_plano').value=c.plano||'essencial';
    document.getElementById('numsForm').innerHTML='';
    const meus=NUMEROS.filter(function(n){ return n.cliente_id===id; });
    if(meus.length){ meus.forEach(function(n){ addNumRow(n); }); } else { addNumRow(); }
    document.getElementById('formMsg').className='msg';
    planoHint(); openForm();
  }
  function openForm(){ document.getElementById('formCard').classList.remove('hidden'); document.getElementById('formCard').scrollIntoView({behavior:'smooth', block:'start'}); }
  function fecharForm(){ document.getElementById('formCard').classList.add('hidden'); }

  function planoHint(){
    const p=document.getElementById('f_plano').value;
    const max=p==='performance'?3:1;
    document.getElementById('planoHint').textContent='('+p+' · até '+max+' número'+(max>1?'s':'')+')';
  }
  function addNumRow(n){
    if(document.querySelectorAll('#numsForm .num-row').length>=3) return;
    const div=document.createElement('div'); div.className='num-row';
    div.dataset.id = (n && n.id) ? n.id : '';
    div.innerHTML='<div><label>Rótulo</label><input class="n_nome" placeholder="Ex.: Loja Centro"></div>'
      +'<div><label>Número</label><input class="n_numero" placeholder="+55 81 9...."></div>'
      +'<div><label>Instância (Evolution)</label><input class="n_inst" placeholder="ex.: cliente_x"></div>'
      +'<div><label>Link painel comercial</label><input class="n_url" placeholder="https://...hubgrupotm.com.br/"></div>'
      +'<button class="rm" title="Remover">×</button>';
    if(n){ div.querySelector('.n_nome').value=n.nome||''; div.querySelector('.n_numero').value=n.numero||''; div.querySelector('.n_inst').value=n.instancia||''; div.querySelector('.n_url').value=n.painel_comercial_url||''; }
    div.querySelector('.rm').addEventListener('click', function(){ removerNumRow(div); });
    document.getElementById('numsForm').appendChild(div);
  }
  function removerNumRow(div){
    const id=div.dataset.id;
    if(id){
      if(!confirm('Remover este número apaga também o histórico de métricas dele. Continuar?')) return;
      numsRemovidos.push(id);
    }
    div.remove();
  }

  async function salvar(){
    const msg=document.getElementById('formMsg'); msg.className='msg';
    const btn=document.getElementById('salvarBtn');
    const dados={
      nome:val('f_nome'), empresa:val('f_empresa'), email:val('f_email'),
      whatsapp:val('f_whatsapp'), plano:document.getElementById('f_plano').value, senha:val('f_senha')
    };
    const rows=[].map.call(document.querySelectorAll('#numsForm .num-row'), function(r){
      return { id:r.dataset.id||null, nome:r.querySelector('.n_nome').value.trim(), numero:r.querySelector('.n_numero').value.trim(), instancia:r.querySelector('.n_inst').value.trim(), painel_comercial_url:r.querySelector('.n_url').value.trim() };
    });

    if(!dados.nome || !dados.email){ msg.className='msg err'; msg.textContent='Preencha nome e email.'; return; }
    btn.disabled=true; btn.textContent='Salvando...';

    try{
      if(editId===null){
        // criar via função segura
        if(!dados.senha){ msg.className='msg err'; msg.textContent='Defina a senha provisória.'; btn.disabled=false; btn.textContent='Cadastrar cliente'; return; }
        dados.numeros=rows.filter(function(n){ return n.nome; });
        const { data:{ session } }=await sb.auth.getSession();
        const res=await fetch(FN_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token, 'apikey':SUPABASE_KEY }, body:JSON.stringify(dados) });
        const out=await res.json();
        if(!res.ok||out.error){ throw new Error(out.error||('HTTP '+res.status)); }
        msg.className='msg ok';
        msg.textContent='Cliente cadastrado. Envie por WhatsApp: acesso em zaptm.hubgrupotm.com.br/painel-cliente.html, login '+dados.email+' e a senha provisória.';
      } else {
        // editar direto (RLS)
        const { error:e1 }=await sb.from('zaptm_clientes').update({ nome:dados.nome, empresa:dados.empresa||null, whatsapp:dados.whatsapp||null, plano:dados.plano }).eq('id', editId);
        if(e1) throw new Error(e1.message);
        // remover números marcados
        if(numsRemovidos.length){ const { error:eDel }=await sb.from('zaptm_numeros').delete().in('id', numsRemovidos); if(eDel) throw new Error(eDel.message); }
        // atualizar / inserir
        for(const r of rows){
          if(!r.nome) continue;
          if(r.id){ const { error:eU }=await sb.from('zaptm_numeros').update({ nome:r.nome, numero:r.numero||null, instancia:r.instancia||null, painel_comercial_url:r.painel_comercial_url||null }).eq('id', r.id); if(eU) throw new Error(eU.message); }
          else { const { error:eI }=await sb.from('zaptm_numeros').insert({ cliente_id:editId, nome:r.nome, numero:r.numero||null, instancia:r.instancia||null, painel_comercial_url:r.painel_comercial_url||null, status:'ativo' }); if(eI) throw new Error(eI.message); }
        }
        msg.className='msg ok'; msg.textContent='Alterações salvas.';
      }
      carregar();
      setTimeout(fecharForm, 1200);
    }catch(e){ msg.className='msg err'; msg.textContent='Erro: '+e.message; }
    btn.disabled=false; btn.textContent = editId===null ? 'Cadastrar cliente' : 'Salvar alterações';
  }

  function val(id){ return document.getElementById(id).value.trim(); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  (async function(){
    const { data:{ session } }=await sb.auth.getSession();
    if(session){ const { data:isAdmin }=await sb.rpc('zaptm_is_admin'); if(isAdmin){ enterApp(); return; } await sb.auth.signOut(); }
    showAuth();
  })();
</script>
</body>
